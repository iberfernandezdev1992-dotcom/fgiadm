<h1 mat-dialog-title style="text-align: center;">Error</h1>
<div mat-dialog-content style="text-align: center;">
  <p>{{ error }}</p>
</div>
<div mat-dialog-actions style="text-align: end;display: block;">
  <button mat-flat-button color="warn" mat-dialog-close aria-label="Cancelar">
    Cerrar
  </button>
</div>
