<div class="flex flex-col flex-auto w-full">
    <div class="flex flex-wrap w-full max-w-screen-xl mx-auto p-6 md:p-8">
      <mat-toolbar color="primary" class="mt-0">
        <mat-toolbar-row>
          <span>GASTOS</span>
          <span class="example-spacer"></span>
          <div class="mt-4">
            <mat-form-field>
              <input matInput placeholder="Buscar Gasto" [matAutocomplete]="auto" [formControl]="searchDataCtrl"
                placeholder="Gasto">
              <button *ngIf="searchDataCtrl.value" matSuffix mat-icon-button aria-label="Clear"
                (click)="clearSelection()">
                <mat-icon>close</mat-icon>
              </button>
              <mat-autocomplete [panelWidth]="400" #auto="matAutocomplete" (optionSelected)="onSelected($event)"
                [displayWith]="displayWith">
                <mat-option *ngIf="isLoadingData" class="is-loading">Loading...</mat-option>
                <ng-container *ngIf="!isLoadingData">
                  <mat-option *ngFor="let item of filteredData" [value]="item">
                    <img alt="" class="example-option-img" [src]="item.imagen" height="25">
                    <span>{{item.nombre}}</span>
                  </mat-option>
                </ng-container>
              </mat-autocomplete>
            </mat-form-field>
            <!-- <mat-form-field class="fuse-mat-dense fuse-mat-no-subscript fuse-mat-rounded ml-3">
              <mat-select [placeholder]="'País'" (selectionChange)="selectpais($event)">
                <mat-option value="All">País</mat-option>
                <mat-option *ngFor="let item of countries" [value]="item.code">{{ item.name }}</mat-option>
              </mat-select>
            </mat-form-field> -->
          </div>
  
  
          <button (click)="create()" mat-icon-button class="example-icon" aria-label="Example icon-button with menu icon">
            <mat-icon>add</mat-icon>
          </button>
        </mat-toolbar-row>
      </mat-toolbar>
      <br><br>
      <!-- Filtros -->
      <mat-form-field>
        <mat-icon matPrefix class="icon-size-5">search</mat-icon>
        <input matInput [autocomplete]="'off'" [placeholder]="'Buscar'" #search>
        <button *ngIf="ifvalInput()" matSuffix mat-icon-button aria-label="Clear" (click)="clearInput()">
          <mat-icon>close</mat-icon>
        </button>
      </mat-form-field>
  
      <div class="example-container mat-elevation-z8">
        <div class="example-loading-shade" *ngIf="isLoadingResults || isRateLimitReached">
          <mat-spinner *ngIf="isLoadingResults"></mat-spinner>
          <div class="example-rate-limit-reached" *ngIf="isRateLimitReached">
            Se alcanzó el límite de tasa de API.Se restablecerá en un minuto.
          </div>
        </div>
  
        <div class="example-table-container sm:overflow-y-auto table-responsive">
  
          <table mat-table matTableExporter [dataSource]="dataSource" matSort (matSortChange)="announceSortChange($event)"
            multiTemplateDataRows matSortActive="created_at" matSortDisableClear matSortDirection="desc"
            class="mat-elevation-z8 w-full">
  
            <ng-container matColumnDef="id">
              <th mat-header-cell *matHeaderCellDef> ID </th>
              <td mat-cell *matCellDef="let element"> {{element.id}} </td>
            </ng-container>
  
            <ng-container matColumnDef="evento_id">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> Evento </th>
              <td mat-cell *matCellDef="let element"> {{element.evento.estado}} </td>
            </ng-container>
  
            <ng-container matColumnDef="nombre">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre </th>
              <td mat-cell *matCellDef="let element"> {{element.nombre}} </td>
            </ng-container>
  
  
  
  
            <ng-container matColumnDef="created_at">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> Creado </th>
              <td mat-cell *matCellDef="let element"> {{element.created_at | date}} </td>
            </ng-container>
  
            <ng-container matColumnDef="acciones" style="width: 15%;">
              <th mat-header-cell *matHeaderCellDef> Acciones </th>
              <td mat-cell *matCellDef="let element">
                <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="botón con menú">
                  <mat-icon>more_vert</mat-icon>
                </button>
                <mat-menu #menu="matMenu">
                  <button mat-menu-item (click)="edit(element)">Editar</button>
                  <button mat-menu-item (click)="delete(element)">Eliminar</button>
                </mat-menu>
              </td>
            </ng-container>
  
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            <tr class="mat-row" *matNoDataRow>
              <td class="mat-cell" colspan="4">No data</td>
            </tr>
          </table>
        </div>
        <mat-paginator #paginator [pageSizeOptions]="pageSizeOptions" (page)="pageChanged($event)"
          showFirstLastButtons="true" aria-label="Select page">
        </mat-paginator>
        <!-- <mat-paginator #paginator [pageIndex]="currentPage" [pageSize]="filtertable.limit"
          [pageSizeOptions]="pageSizeOptions" (page)="pageChanged($event)" aria-label="Select page">
        </mat-paginator> -->
      </div>
    </div>
  </div>
